spring.application.name=Fas3a

# ===== Base de donnees PostgreSQL =====
# Le mot de passe n'est jamais ecrit ici : il est lu depuis la variable
# d'environnement DB_PASSWORD (a definir dans la configuration d'execution IntelliJ).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/attendflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
# update : Hibernate cree et met a jour les tables a partir des entites Java.
spring.jpa.hibernate.ddl-auto=update
# Affiche les requetes SQL dans la console (utile pendant le developpement).
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Interface entierement en francais (dates : "lundi 21 septembre") =====
spring.web.locale=fr_FR
spring.web.locale-resolver=fixed

# ===== Session (F-04 : expiration automatique) =====
server.servlet.session.timeout=30m

# ===== Justificatifs (F-24) : PDF ou image, 5 Mo maximum =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
attendflow.uploads.dir=uploads/justificatifs

# ===== Serveur =====
# 8080 est deja utilise par Oracle Database (TNSLSNR) sur ce poste. En ligne, l hebergeur fournit PORT.
server.port=${PORT:8081}

# ===== Emails (reinitialisation du mot de passe + copie de chaque notification) =====
# Par defaut : Mailpit en local (boite de reception sur http://localhost:8025, rien ne sort du PC).
# Gmail : MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, MAIL_USERNAME=adresse, MAIL_PASSWORD=mot de passe d'application,
#         MAIL_AUTH=true, MAIL_STARTTLS=true, MAIL_FROM=adresse
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.default-encoding=UTF-8
attendflow.mail.from=${MAIL_FROM:Fas3a <no-reply@fas3a.local>}
# Adresse de l'application dans les emails de notification
attendflow.url=${APP_URL:http://localhost:8081}

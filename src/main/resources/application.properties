spring.application.name=Fas3a

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/attendflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.web.locale=fr_FR
spring.web.locale-resolver=fixed

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

server.servlet.session.timeout=30m

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
attendflow.uploads.dir=uploads/justificatifs

server.port=${PORT:8081}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.default-encoding=UTF-8
attendflow.mail.from=${MAIL_FROM:Fas3a <no-reply@fas3a.local>}
attendflow.url=${APP_URL:http://localhost:8081}

spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

attendflow.demo.motdepasse=${DEMO_PASSWORD:}

attendflow.limite.requetes-par-minute=${RATE_LIMIT:300}

attendflow.turnstile.site-key=${TURNSTILE_SITE_KEY:1x00000000000000000000AA}
attendflow.turnstile.secret-key=${TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}
spring.config.import=optional:file:./config/local.properties

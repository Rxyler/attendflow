<!doctype html>
<html lang="fr" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<!-- En-tete commun : polices, Bootstrap 5, theme, mouvement (GSAP + Lenis), icones (Lucide) -->
<head th:fragment="head(titre)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" th:content="#{meta.description}">
  <meta name="theme-color" content="#fbf5e8">
  <title th:text="${titre} + ' · Fas3a'">Fas3a</title>
  <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand+SC&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" rel="stylesheet">
  <link href="https://unpkg.com/lenis@1.1.13/dist/lenis.css" integrity="sha384-pAFowDtEJGvoq8dGiFmgKkO1h5cvbHkCysvXumyjfJBsi8qJwG429whEp2xanR+c" crossorigin="anonymous" rel="stylesheet">
  <link th:href="@{/css/attendflow.css}" rel="stylesheet">
  <link th:href="@{/css/doodle.css}" rel="stylesheet">
  <!-- Masque le contenu jusqu'a l'animation d'entree (evite le clignotement) ; filet de securite 1,5 s -->
  <script>
    var t = 'dark'; try { t = localStorage.getItem('af-theme') || 'dark'; } catch (e) {}
    document.documentElement.setAttribute('data-bs-theme', t);
    document.documentElement.classList.add('af-fond-attente');
    // ?lang=en a deja ete pris en compte par le serveur : on le retire de l'adresse affichee
    if (/[?&]lang=/.test(location.search) && history.replaceState) { var u = new URL(location.href); u.searchParams.delete('lang'); history.replaceState(null, '', u); }
    // une navigation rapide interrompt la transition entre pages : ce n'est pas une erreur
    addEventListener('pagereveal', function (e) { var v = e.viewTransition; if (v) { v.ready.catch(function () {}); v.finished.catch(function () {}); } });
    // avant le premier rendu : rideau deja vu dans la session, pause choisie par l'utilisateur
    try { if (sessionStorage.getItem('af-charge')) document.documentElement.classList.add('af-deja');
          if (localStorage.getItem('af-calme') === '1') document.documentElement.classList.add('af-calme'); } catch (e) {}
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('af-prep');
      setTimeout(function () { document.documentElement.classList.remove('af-prep'); }, 1500);
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/rough-notation@0.5.1/lib/rough-notation.iife.js" integrity="sha384-IW2mAEaBUcGJfuKi7uhlzpZGhnDDnjI9NLtADxl9xKV6VJPzuuIqhIKyLwiAuRmu" crossorigin="anonymous"></script>
  <script defer src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js" integrity="sha384-ieG+IKD0d/ZPXyCBTMVAbqsQdns8QGJR/e26WMw7M4fkaI/rHcS/YIoi+ah9WGge" crossorigin="anonymous"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt" crossorigin="anonymous"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" integrity="sha384-Z3REaz79l2IaAZqJsSABtTbhjgOUYyV3p90XNnAPCSHg3EMTz1fouunq9WZRtj3d" crossorigin="anonymous"></script>
  <script defer src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js" integrity="sha384-B2WBjDzEjJpYvhmi2UyEn7rektqkf5suS6sNoyyrf0EBAwBHdkiXxIlU0V5Ru2ed" crossorigin="anonymous"></script>
  <script defer th:src="@{/js/attendflow.js}"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" integrity="sha384-sPwMflxqfAN+Q5mvlkLmHiX3PORGbZSXHiSGPTXT9VHCD/AB+b+r+vJWsqprv+7k" crossorigin="anonymous"></script>
  <script defer th:src="@{/js/compagnons.js}"></script>
</head>

<body>
<!-- Fond commun : aurora animee (canvas), grille, grain -->
<!-- Fond du carnet : le papier pointe est dessine en CSS (doodle.css) ; plus d'aurore ni de particules a animer -->
<th:block th:fragment="fond"></th:block>

<!-- Interrupteur clair / sombre -->
<th:block th:fragment="theme">
  <button type="button" class="af-theme af-langue" th:attr="data-lang=#{langue.autre},aria-label=#{langue.basculer},title=#{langue.basculer}" th:text="#{langue.autreCode}">EN</button>
  <button type="button" class="af-theme af-pause" aria-pressed="false" th:attr="aria-label=#{bouton.pause},title=#{bouton.pause}">
    <i data-lucide="pause" class="af-pause-off" aria-hidden="true"></i>
    <i data-lucide="play" class="af-pause-on" aria-hidden="true"></i>
  </button>
  <button type="button" class="af-theme" th:attr="aria-label=#{bouton.theme},title=#{bouton.themeTitre}">
    <i data-lucide="sun" class="af-soleil" aria-hidden="true"></i>
    <i data-lucide="moon" class="af-lune" aria-hidden="true"></i>
  </button>
</th:block>

<!-- Barre laterale commune -->
<nav th:fragment="sidebar(utilisateur, actif)" class="af-sidebar d-flex flex-column px-3 py-3 flex-shrink-0"
     th:attr="aria-label=#{nav.principale}"
     th:with="role=${utilisateur.role.name()}">
  <a href="#contenu" class="visually-hidden-focusable btn btn-light btn-sm mb-2" th:text="#{commun.allerContenu}">Aller au contenu</a>

  <a th:href="@{/}" class="af-tete d-flex align-items-center gap-2 px-2 mb-2 text-decoration-none">
    <span class="af-logo" aria-hidden="true"></span>
    <span class="d-flex flex-column">
      <span class="af-marque fw-semibold lh-sm">Fas3a</span>
      <span class="af-espace"
            th:text="${role == 'ADMIN'} ? #{espace.admin} : (${role == 'ENSEIGNANT'} ? #{espace.enseignant} : #{espace.etudiant})">Espace</span>
    </span>
  </a>

  <div class="af-navs">
  <div class="af-section" th:text="#{nav.general}">Général</div>
  <ul class="nav flex-column gap-1">
    <li class="nav-item">
      <a th:href="@{/}" class="nav-link" th:classappend="${actif == 'accueil'} ? 'active'"
         th:attr="aria-current=${actif == 'accueil'} ? 'page' : null">
        <i data-lucide="layout-dashboard" aria-hidden="true"></i><span th:text="#{nav.tableau}">Tableau de bord</span></a>
    </li>
    <li class="nav-item">
      <a th:href="@{/emploi-du-temps}" class="nav-link" th:classappend="${actif == 'emploi-du-temps'} ? 'active'"
         th:attr="aria-current=${actif == 'emploi-du-temps'} ? 'page' : null">
        <i data-lucide="calendar-days" aria-hidden="true"></i><span th:text="#{nav.edt}">Emploi du temps</span></a>
    </li>
    <li class="nav-item" th:if="${role != 'ETUDIANT'}">
      <a th:href="@{/rapports}" class="nav-link" th:classappend="${actif == 'rapports'} ? 'active'"
         th:attr="aria-current=${actif == 'rapports'} ? 'page' : null">
        <i data-lucide="chart-column" aria-hidden="true"></i>
        <span th:text="${role == 'ADMIN'} ? #{nav.rapports} : #{nav.statistiques}">Rapports</span></a>
    </li>
    <li class="nav-item" th:if="${role == 'ETUDIANT'}">
      <a th:href="@{/etudiant/historique}" class="nav-link" th:classappend="${actif == 'historique'} ? 'active'"
         th:attr="aria-current=${actif == 'historique'} ? 'page' : null">
        <i data-lucide="history" aria-hidden="true"></i><span th:text="#{nav.historique}">Mon historique</span></a>
    </li>
    <li class="nav-item" th:if="${role != 'ENSEIGNANT'}">
      <a th:href="${role == 'ADMIN'} ? @{/admin/justificatifs} : @{/etudiant/justificatifs}" class="nav-link"
         th:classappend="${actif == 'justificatifs'} ? 'active'"
         th:attr="aria-current=${actif == 'justificatifs'} ? 'page' : null">
        <i data-lucide="file-check" aria-hidden="true"></i>
        <span th:text="${role == 'ADMIN'} ? #{nav.justificatifs} : #{nav.mesJustificatifs}">Justificatifs</span></a>
    </li>
    <li class="nav-item">
      <a th:href="@{/notifications}" class="nav-link" th:classappend="${actif == 'notifications'} ? 'active'"
         th:attr="aria-current=${actif == 'notifications'} ? 'page' : null">
        <i data-lucide="bell" aria-hidden="true"></i><span th:text="#{nav.notifications}">Notifications</span>
        <span th:if="${nbNonLues != null and nbNonLues > 0}" class="badge text-bg-danger"
              th:text="${nbNonLues}" th:attr="aria-label=#{nav.nonLues(${nbNonLues})}">2</span>
      </a>
    </li>
    <li class="nav-item">
      <a th:href="@{/profil}" class="nav-link" th:classappend="${actif == 'profil'} ? 'active'"
         th:attr="aria-current=${actif == 'profil'} ? 'page' : null">
        <i data-lucide="smile" aria-hidden="true"></i><span th:text="#{nav.profil}">Mon profil</span></a>
    </li>
  </ul>

  <th:block th:if="${role == 'ADMIN'}">
    <div class="af-section" th:text="#{nav.administration}">Administration</div>
    <ul class="nav flex-column gap-1">
      <li class="nav-item" th:each="lien : ${ {{'etudiants','nav.etudiants','graduation-cap'},{'classes','nav.classes','users'},{'matieres','nav.matieres','book-open'},{'enseignants','nav.enseignants','user-round'},{'synchronisation','nav.synchronisation','refresh-cw'},{'parametres','nav.parametres','sliders-horizontal'}} }">
        <a th:href="@{/admin/{p}(p=${lien[0]})}" class="nav-link" th:classappend="${actif == lien[0]} ? 'active'"
           th:attr="aria-current=${actif == lien[0]} ? 'page' : null">
          <i th:attr="data-lucide=${lien[2]}" aria-hidden="true"></i><span th:text="#{__${lien[1]}__}">Lien</span></a>
      </li>
    </ul>
  </th:block>
  </div>

  <div class="mt-auto pt-3">
    <div class="af-compte">
      <a th:href="@{/profil}" class="af-avatar" th:attr="title=#{nav.profil},aria-label=#{nav.profil}">
        <img th:if="${utilisateur.mascotte}" th:src="@{${utilisateur.mascotte.image}}" alt="">
        <th:block th:unless="${utilisateur.mascotte}"
                  th:text="${#strings.toUpperCase(#strings.substring(utilisateur.prenom, 0, 1) + #strings.substring(utilisateur.nom, 0, 1))}">SA</th:block></a>
      <span class="af-identite flex-grow-1 min-w-0">
        <span class="af-nom d-block text-truncate" th:text="${utilisateur.nomComplet}">Nom</span>
        <span class="af-mail d-block text-truncate" th:text="${utilisateur.email}">email</span>
      </span>
      <button th:replace="~{fragments/layout :: theme}"></button>
      <form th:action="@{/logout}" method="post" class="m-0">
        <button type="submit" class="af-deconnexion" th:attr="title=#{compte.deconnexion},aria-label=#{compte.deconnexion}">
          <i data-lucide="log-out" aria-hidden="true"></i>
        </button>
      </form>
    </div>
  </div>
</nav>

<!-- Carte statistique : icone et teinte deduites du libelle ; la valeur s'anime si elle est numerique -->
<div th:fragment="carte(libelle, valeur, detail)" class="af-glass af-stat h-100"
     th:with="l=${#strings.toLowerCase(libelle)},
              icone=${#strings.contains(l, 'taux') or #strings.contains(l, 'rate')} ? 'percent' :
                    (${#strings.contains(l, 'absence')} ? 'user-x' :
                    (${#strings.contains(l, 'retard') or #strings.contains(l, 'late')} ? 'clock' :
                    (${#strings.contains(l, 'justifi') or #strings.contains(l, 'excus')} ? 'file-check' :
                    (${#strings.contains(l, 'présen') or #strings.contains(l, 'present')} ? 'user-check' :
                    (${#strings.contains(l, 'séance') or #strings.contains(l, 'session')} ? 'calendar-check' :
                    (${#strings.contains(l, 'étudiant') or #strings.contains(l, 'student')} ? 'graduation-cap' : 'activity')))))),
              ton=${#strings.contains(l, 'taux') or #strings.contains(l, 'rate')} ? 'bleu' :
                    (${#strings.contains(l, 'absence')} ? 'rouge' :
                    (${#strings.contains(l, 'retard') or #strings.contains(l, 'late')} ? 'orange' :
                    (${#strings.contains(l, 'présen') or #strings.contains(l, 'present')} ? 'vert' : 'neutre')))"
     th:attr="data-ton=${ton}">
  <div class="af-stat-tete">
    <p class="af-stat-libelle" th:text="${libelle}">Libellé</p>
    <span class="af-stat-icone" aria-hidden="true"><i th:attr="data-lucide=${icone}"></i></span>
  </div>
  <p class="af-stat-value" data-compteur th:text="${valeur}">0</p>
  <p class="af-stat-detail" th:if="${detail}" th:text="${detail}">détail</p>
</div>

<!-- Graphique du taux de presence (Chart.js) ; donnees : joursGraphique et tauxGraphique -->
<section th:fragment="graphique(titre, sousTitre)" class="af-glass p-4 h-100" aria-labelledby="g7-titre">
  <h2 id="g7-titre" class="h6 mb-1" th:text="${titre}">Taux de présence</h2>
  <p class="small text-secondary mb-3" th:text="${sousTitre}">détail</p>
  <p th:if="${tauxGraphique != null and #lists.isEmpty(tauxGraphique.?[#this != null])}" class="text-secondary mb-0 af-graphique-vide" th:text="#{graphique.vide}">Aucun appel saisi ces 7 derniers jours.</p>
  <canvas id="graphique-7j" height="160" role="img" th:attr="aria-label=${titre}" th:hidden="${tauxGraphique != null and #lists.isEmpty(tauxGraphique.?[#this != null])}"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" integrity="sha384-NrKB+u6Ts6AtkIhwPixiKTzgSKNblyhlk0Sohlgar9UHUBzai/sgnNNWWd291xqt" crossorigin="anonymous"></script>
  <script th:src="@{/js/graphiques.js}"></script>
  <script th:inline="javascript">
    new Chart(document.getElementById('graphique-7j'), {
      type: 'line',
      data: {
        labels: /*[[${joursGraphique}]]*/ [],
        datasets: [{ label: /*[[#{graphique.taux}]]*/ 'Taux', data: /*[[${tauxGraphique}]]*/ [], borderColor: '#13a89e', borderWidth: 2.5,
          backgroundColor: 'rgba(19, 168, 158, 0.14)', fill: true, tension: 0.3, spanGaps: false,
          pointRadius: 3, pointHoverRadius: 5, pointBackgroundColor: '#fffaf0', pointBorderWidth: 2 }]
      },
      options: { scales: { y: { min: 0, max: 100, ticks: { callback: v => v + ' %' } } },
                 plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ' ' + c.parsed.y + ' %' } } } }
    });
  </script>
</section>
</body>
</html>

<!doctype html>
<html lang="fr" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{titre.justificatifs})}"></head>
<body>
<th:block th:replace="~{fragments/layout :: fond}"></th:block>
<div class="d-flex min-vh-100">
  <nav th:replace="~{fragments/layout :: sidebar(${utilisateur}, 'justificatifs')}"></nav>

  <div class="flex-grow-1 d-flex flex-column min-w-0">
    <header class="af-header px-4 py-3">
      <h1 class="h5 fw-bold mb-0" th:text="#{titre.justificatifs}">Justificatifs</h1>
      <p class="small text-secondary mb-0" th:text="#{justif.enAttenteCompte(${#lists.size(enAttente)})}">0 en attente</p>
    </header>

    <main id="contenu" class="p-4 d-grid gap-4">
      <div th:if="${succes}" class="alert alert-success mb-0" role="status" th:text="${succes}">ok</div>
      <div th:if="${erreur}" class="alert alert-danger mb-0" role="alert" th:text="${erreur}">erreur</div>

      <section aria-labelledby="attente-titre" class="d-grid gap-3">
        <h2 id="attente-titre" class="h6 fw-bold mb-0" th:text="#{justif.enAttente}">En attente</h2>
        <p th:if="${#lists.isEmpty(enAttente)}" class="af-glass p-4 text-secondary mb-0" th:text="#{justif.aucunEnAttente}">Aucun justificatif en attente.</p>
        <article th:each="j : ${enAttente}" class="af-glass p-3 d-flex flex-wrap gap-3 align-items-center"
                 th:with="p=${j.presence}">
          <div class="flex-grow-1">
            <p class="fw-bold mb-0">
              <a th:if="${base == '/admin/justificatifs'}" th:href="@{/admin/etudiants/{id}/historique(id=${p.etudiant.id})}" th:text="${p.etudiant.nomComplet}">Nom</a>
              <span th:unless="${base == '/admin/justificatifs'}" th:text="${p.etudiant.nomComplet}">Nom</span>
              <span class="small text-secondary fw-normal" th:text="', ' + ${p.etudiant.classe.nom}">classe</span>
            </p>
            <p class="small mb-1"
               th:text="#{justif.absenceDu(${#temporals.format(p.seance.date, 'dd/MM/yyyy')}, ${p.seance.heureDebut}, ${p.seance.matiere.intitule})}">absence</p>
            <p class="small text-secondary mb-0" th:text="#{justif.motifDepose(${j.motif}, ${#temporals.format(j.dateDepot, 'dd/MM/yyyy HH:mm')})}">motif</p>
          </div>
          <a th:href="@{/justificatifs/{id}/fichier(id=${j.id})}" target="_blank" rel="noopener"
             class="btn btn-sm btn-light border"><i data-lucide="eye" aria-hidden="true"></i>[[#{justif.voirDocument}]]</a>
          <form th:action="@{__${base}__/{id}/refuser(id=${j.id})}" method="post">
            <button type="submit" class="btn btn-sm btn-outline-danger"><i data-lucide="x" aria-hidden="true"></i>[[#{justif.refuser}]]</button>
          </form>
          <form th:action="@{__${base}__/{id}/accepter(id=${j.id})}" method="post">
            <button type="submit" class="btn btn-sm btn-success"><i data-lucide="check" aria-hidden="true"></i>[[#{justif.accepter}]]</button>
          </form>
        </article>
      </section>

      <div class="af-glass p-0 overflow-hidden" th:unless="${#lists.isEmpty(traites)}">
        <table class="table align-middle mb-0">
          <caption class="px-4" th:text="#{justif.dernieresDecisions}">20 dernières décisions</caption>
          <thead>
          <tr>
            <th scope="col" class="ps-4" th:text="#{champ.etudiant}">Étudiant</th>
            <th scope="col" th:text="#{justif.absence}">Absence</th>
            <th scope="col" th:text="#{justif.decision}">Décision</th>
            <th scope="col" th:text="#{justif.par}">Par</th>
            <th scope="col" class="pe-4" th:text="#{justif.le}">Le</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="j : ${traites}">
            <td class="ps-4" th:text="${j.presence.etudiant.nomComplet}">Nom</td>
            <td class="small" th:text="${#temporals.format(j.presence.seance.date, 'dd/MM/yyyy')} + ', ' + ${j.presence.seance.matiere.intitule}">absence</td>
            <td>
              <span class="badge rounded-pill" th:classappend="${j.etat.name() == 'ACCEPTE'} ? 'text-bg-success' : 'text-bg-danger'"
                    th:text="#{__${'justif.' + j.etat.name()}__}">Décision</span>
            </td>
            <td class="small" th:text="${j.traitant != null} ? ${j.traitant.nomComplet} : '—'">admin</td>
            <td class="pe-4 small font-monospace" th:text="${#temporals.format(j.dateTraitement, 'dd/MM/yyyy HH:mm')}">date</td>
          </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>
</body>
</html>

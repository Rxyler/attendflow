<!doctype html>
<html lang="fr" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{titre.tableau})}"></head>
<body>
<th:block th:replace="~{fragments/layout :: fond}"></th:block>
<div class="d-flex min-vh-100" th:with="t=${tableau}">
  <nav th:replace="~{fragments/layout :: sidebar(${utilisateur}, 'accueil')}"></nav>

  <div class="flex-grow-1 d-flex flex-column min-w-0">
    <header class="af-header px-4 py-3">
      <h1 class="h5 fw-bold mb-0" th:text="#{titre.tableau}">Tableau de bord</h1>
      <p class="small text-secondary mb-0" th:text="${#temporals.format(#temporals.createToday(), 'EEEE d MMMM yyyy')}">date</p>
    </header>

    <main id="contenu" class="p-4 d-grid gap-4">
      <h2 class="h4 fw-bold mb-0">[[#{tableau.bonjour}]], <span th:text="${utilisateur.prenom}">Prénom</span></h2>

      <div class="row g-3">
        <div class="col-6 col-xl-3"><div th:replace="~{fragments/layout :: carte(#{carte.seancesAujourdhui}, ${t.seancesDuJour}, #{carte.tousEnseignants})}"></div></div>
        <div class="col-6 col-xl-3"><div th:replace="~{fragments/layout :: carte(#{carte.etudiants}, ${t.etudiants}, #{carte.toutesClasses})}"></div></div>
        <div class="col-6 col-xl-3"><div th:replace="~{fragments/layout :: carte(#{carte.absences}, ${t.absents}, #{carte.septJours})}"></div></div>
        <div class="col-6 col-xl-3"><div th:replace="~{fragments/layout :: carte(#{carte.taux}, ${t.taux != null} ? ${t.taux} + ' %' : '—', #{carte.septJours})}"></div></div>
      </div>

      <div class="row g-4">
        <div class="col-xl-7"><section th:replace="~{fragments/layout :: graphique(#{graphique.titre7j}, #{graphique.joursVides})}"></section></div>

        <!-- F-30 / F-34 : etudiants au-dela du seuil -->
        <div class="col-xl-5">
          <section class="af-glass p-4 h-100" aria-labelledby="risque-titre">
            <h2 id="risque-titre" class="h6 fw-bold" th:text="#{tableau.aRisque}">Étudiants à absences fréquentes</h2>
            <p th:if="${#lists.isEmpty(t.aRisque)}" class="text-secondary mb-0" th:text="#{tableau.aucunRisque}">Aucun étudiant ne dépasse le seuil.</p>
            <ul class="list-group list-group-flush" th:unless="${#lists.isEmpty(t.aRisque)}">
              <li class="list-group-item bg-transparent px-0 d-flex justify-content-between align-items-center"
                  th:each="r : ${t.aRisque}">
                <span>
                  <a th:href="@{/admin/etudiants/{id}/historique(id=${r.etudiant.id})}" class="fw-semibold"
                     th:text="${r.etudiant.nomComplet}">Nom</a>
                  <span class="small text-secondary d-block"
                        th:text="#{tableau.classeAbsences(${r.etudiant.classe.nom}, ${r.absences})}">détail</span>
                </span>
                <span class="fw-bold text-danger" th:text="${r.taux} + ' %'">65 %</span>
              </li>
            </ul>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>

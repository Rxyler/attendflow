<!doctype html>
<html lang="fr" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{titre.erreur})}"></head>
<body>
<th:block th:replace="~{fragments/layout :: fond}"></th:block>
<main id="contenu" class="af-auth" th:with="code=${status ?: 500}">
  <div class="af-glass af-auth-card text-center" style="max-width: 28rem">
    <img th:src="@{/images/mascottes/filou.svg}" alt="" class="af-mascotte mx-auto mb-3" width="96" height="96">
    <p class="small text-secondary mb-1" th:text="#{erreur.code(${code})}">Erreur 404</p>
    <h1 class="h4 mb-2" th:text="${code == 404} ? #{erreur.404} : (${code == 403} ? #{erreur.403} : (${code == 400} ? #{erreur.400} : #{erreur.autre}))">Page introuvable</h1>
    <p class="text-secondary mb-4" th:text="${code == 404} ? #{erreur.404Texte} : (${code == 403} ? #{erreur.403Texte} : (${code == 400} ? #{erreur.400Texte} : #{erreur.autreTexte}))">message</p>
    <a th:href="@{/}" class="btn btn-af"><i data-lucide="house" aria-hidden="true"></i>[[#{commun.retourAccueil}]]</a>
  </div>
</main>
</body>
</html>

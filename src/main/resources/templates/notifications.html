<!doctype html>
<html lang="fr" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{titre.notifications})}"></head>
<body>
<th:block th:replace="~{fragments/layout :: fond}"></th:block>
<div class="d-flex min-vh-100">
  <nav th:replace="~{fragments/layout :: sidebar(${utilisateur}, 'notifications')}"></nav>

  <div class="flex-grow-1 d-flex flex-column min-w-0">
    <header class="af-header px-4 py-3 d-flex flex-wrap align-items-center justify-content-between gap-2">
      <div>
        <h1 class="h5 fw-bold mb-0" th:text="#{titre.notifications}">Notifications</h1>
        <p class="small text-secondary mb-0" th:text="#{notif.nonLues(${nbNonLues})}">0 non lue</p>
      </div>
      <form th:action="@{/notifications/tout-lu}" method="post">
        <button type="submit" class="btn btn-sm btn-link fw-semibold" th:disabled="${nbNonLues == 0}"><i data-lucide="check-check" aria-hidden="true"></i>[[#{notif.toutLu}]]</button>
      </form>
    </header>

    <main id="contenu" class="p-4 d-grid gap-3 align-content-start">
      <div class="d-flex gap-2 small">
        <span class="badge rounded-pill text-bg-primary" th:text="#{notif.INFORMATION}">Information</span>
        <span class="badge rounded-pill text-bg-warning" th:text="#{notif.AVERTISSEMENT}">Avertissement</span>
        <span class="badge rounded-pill text-bg-success" th:text="#{notif.SUCCES}">Succès</span>
      </div>

      <div th:if="${#lists.isEmpty(notifications)}" class="af-glass p-5 text-center text-secondary" th:text="#{notif.aucune}">Aucune notification pour le moment.</div>

      <!-- F-35 : trois niveaux visuels -->
      <article th:each="n : ${notifications}" class="af-glass p-3 d-flex gap-3 align-items-start position-relative"
               th:classappend="${(n.lue ? 'opacity-75 ' : '') + (n.lien != null ? 'af-notif-lien' : '')}">
        <span class="badge rounded-pill flex-shrink-0 mt-1"
              th:classappend="${n.type.name() == 'INFORMATION'} ? 'text-bg-primary' : (${n.type.name() == 'AVERTISSEMENT'} ? 'text-bg-warning' : 'text-bg-success')"
              th:text="#{__${'notif.' + n.type.name()}__}">Type</span>
        <div class="flex-grow-1">
          <h2 class="h6 fw-bold mb-1">
            <a th:if="${n.lien != null}" th:href="@{/notifications/{id}(id=${n.id})}" class="stretched-link text-reset text-decoration-none"
               th:text="${n.titre}">Titre</a>
            <span th:unless="${n.lien != null}" th:text="${n.titre}">Titre</span>
            <span th:unless="${n.lue}" class="badge rounded-pill text-bg-primary ms-1" style="font-size:.75rem" th:text="#{notif.nouveau}">Nouveau</span>
          </h2>
          <p class="mb-1" th:text="${n.message}">Message</p>
          <p class="small text-secondary mb-0" th:text="${#temporals.format(n.date, 'dd/MM/yyyy HH:mm')}">date</p>
        </div>
        <i th:if="${n.lien != null}" data-lucide="arrow-up-right" aria-hidden="true" class="af-notif-fleche flex-shrink-0 mt-1"></i>
        <!-- au-dessus du lien etire : ce bouton marque lue sans ouvrir la page -->
        <form th:unless="${n.lue}" th:action="@{/notifications/{id}/lue(id=${n.id})}" method="post" class="position-relative" style="z-index:2">
          <button type="submit" class="btn btn-sm btn-light border"><i data-lucide="check" aria-hidden="true"></i>[[#{notif.marquerLu}]]</button>
        </form>
      </article>
    </main>
  </div>
</div>
</body>
</html>

<!doctype html>
<html lang="fr" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{titre.parametres})}"></head>
<body>
<th:block th:replace="~{fragments/layout :: fond}"></th:block>
<div class="d-flex min-vh-100">
  <nav th:replace="~{fragments/layout :: sidebar(${utilisateur}, 'parametres')}"></nav>

  <div class="flex-grow-1 d-flex flex-column min-w-0">
    <header class="af-header px-4 py-3">
      <h1 class="h5 fw-bold mb-0" th:text="#{parametres.titre}">Paramètres de la plateforme</h1>
      <p class="small text-secondary mb-0"
         th:text="${modifiePar} ? #{parametres.modifiePar(${modifiePar})} : #{parametres.defaut}">info</p>
    </header>

    <main id="contenu" class="p-4 d-grid gap-4" style="max-width: 52rem">
      <div th:if="${succes}" class="alert alert-success mb-0" role="status" th:text="${succes}">ok</div>
      <div th:if="${erreur}" class="alert alert-danger mb-0" role="alert" th:text="${erreur}">erreur</div>

      <form th:action="@{/admin/parametres}" method="post" class="d-grid gap-4">
        <!-- RG-05 -->
        <section class="af-glass p-4" aria-labelledby="t-seuils">
          <h2 id="t-seuils" class="h6 fw-bold" th:text="#{parametres.seuils}">Seuils d’alerte</h2>
          <p class="small text-secondary" th:text="#{parametres.seuilsTexte}">Un étudiant est signalé.</p>
          <div class="row g-3">
            <div class="col-md-6"><label for="seuil" class="form-label" th:text="#{parametres.seuil}">Seuil d’absence (%)</label>
              <input id="seuil" name="seuilAbsence" type="number" min="0.1" max="100" step="0.1" required
                     class="form-control" th:value="${form.seuilAbsence}"></div>
            <div class="col-md-6"><label for="nbmax" class="form-label" th:text="#{parametres.nbMax}">Absences non justifiées max.</label>
              <input id="nbmax" name="nbMaxAbsencesNonJustifiees" type="number" min="1" max="200" required
                     class="form-control" th:value="${form.nbMaxAbsencesNonJustifiees}"></div>
          </div>
        </section>

        <!-- F-22 -->
        <section class="af-glass p-4" aria-labelledby="t-delai">
          <h2 id="t-delai" class="h6 fw-bold" th:text="#{parametres.modification}">Modification des présences</h2>
          <label for="delai" class="form-label" th:text="#{parametres.delai}">Délai de modification</label>
          <input id="delai" name="delaiModificationHeures" type="number" min="0" max="720" required
                 class="form-control" style="max-width: 12rem" th:value="${form.delaiModificationHeures}"
                 aria-describedby="delai-aide">
          <div id="delai-aide" class="form-text" th:text="#{parametres.delaiAide}">Passé ce délai.</div>
        </section>

        <!-- RG-04 -->
        <section class="af-glass p-4" aria-labelledby="t-taux">
          <h2 id="t-taux" class="h6 fw-bold" th:text="#{parametres.calcul}">Calcul du taux de présence</h2>
          <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" role="switch" id="retard" name="retardCommePresent" value="true"
                   th:checked="${form.retardCommePresent}">
            <label class="form-check-label" for="retard" th:text="#{parametres.retard}">Compter un retard comme une présence</label>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="justifie" name="justifieCommePresent" value="true"
                   th:checked="${form.justifieCommePresent}">
            <label class="form-check-label" for="justifie" th:text="#{parametres.justifie}">Compter une absence justifiée comme une présence</label>
          </div>
        </section>

        <div><button type="submit" class="btn btn-af px-4" th:text="#{commun.enregistrer}">Enregistrer</button></div>
      </form>
    </main>
  </div>
</div>
</body>
</html>

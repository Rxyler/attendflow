<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mot de passe oublié')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: fond}"></th:block>
<main id="contenu" class="af-auth">
  <div class="w-100" style="max-width: 26rem">
  <a th:href="@{/}" class="d-inline-flex align-items-center gap-2 mb-4 text-decoration-none fw-semibold text-white"><span class="af-logo" aria-hidden="true"></span>Fas3a</a>
  <div class="af-glass af-auth-card position-relative">
    <div class="position-absolute" style="top: 1rem; right: 1rem; z-index: 2"><button th:replace="~{fragments/layout :: theme}"></button></div>
    <h1 class="mb-1">Mot de passe oublié</h1>
    <p class="text-secondary mb-4">Saisissez votre email pour recevoir un lien de réinitialisation.</p>

    <div th:if="${param.envoye}" class="alert alert-success" role="status">
      Si un compte existe pour cet email, un lien de réinitialisation vient d’être envoyé.
      Il est valable 30 minutes.
    </div>

    <form th:unless="${param.envoye}" th:action="@{/mot-de-passe-oublie}" method="post" class="d-grid gap-3">
      <div>
        <label for="email" class="form-label fw-medium">Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="email@univ.tn"
               autocomplete="email" required autofocus>
      </div>
      <button type="submit" class="btn btn-af py-2"><i data-lucide="mail" aria-hidden="true"></i>Envoyer le lien</button>
    </form>

    <a th:href="@{/login}" class="d-block text-center mt-4 small fw-medium text-decoration-none"><i data-lucide="arrow-left" aria-hidden="true" style="width:1rem;height:1rem;vertical-align:-3px"></i> Retour à la connexion</a>
  </div>
</div>
</main>
</body>
</html>

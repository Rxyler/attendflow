spring.application.name=Fas3a

spring.datasource.url=jdbc:h2:mem:attendflow-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

attendflow.uploads.dir=target/test-uploads

attendflow.synchro.cron=-
attendflow.rappels.cron=-
attendflow.resume.cron=-

spring.mail.host=localhost
spring.mail.port=9

spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

attendflow.limite.requetes-par-minute=0

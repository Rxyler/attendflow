spring.application.name=Fas3a

# Les tests utilisent une base H2 en memoire : ils tournent sans PostgreSQL
# et ne touchent jamais aux vraies donnees.
spring.datasource.url=jdbc:h2:mem:attendflow-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

attendflow.uploads.dir=target/test-uploads

# Taches planifiees desactivees ("-") : les tests appellent directement les methodes.
attendflow.synchro.cron=-
attendflow.rappels.cron=-
attendflow.resume.cron=-

# Aucun serveur mail pendant les tests (port 9 ferme) : les envois echouent proprement et sont journalises.
spring.mail.host=localhost
spring.mail.port=9
